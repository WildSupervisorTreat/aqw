<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="Проголосуй за меня!">
<meta property="og:description" content="это займёт пару секунд">
<meta name="twitter:card" content="summary">
<title>Розыгрыш</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141518;--card:rgba(255,255,255,.04);--stroke:rgba(212,175,55,.18);--text:#F5F3EE;--muted:#A9A59B;
  --a1:#D4AF37;--a2:#F0D877;--mint:#F0D877;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);background:var(--bg);font-family:'Manrope',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(100px);z-index:0;pointer-events:none}
body::before{width:560px;height:560px;top:-200px;right:-160px;background:rgba(212,175,55,.22)}
body::after{width:480px;height:480px;bottom:-220px;left:-160px;background:rgba(40,40,44,.7)}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:44px 20px 70px}
.kicker{display:inline-flex;align-items:center;gap:9px;margin:0;padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--stroke);font-size:13px;font-weight:800;letter-spacing:.02em;color:#F0D877;backdrop-filter:blur(8px)}
.check{width:18px;height:18px;flex:none}
h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(32px,8.5vw,54px);line-height:1.05;letter-spacing:-.03em;margin:22px 0 0}
.lede{margin:14px 0 0;color:var(--muted);font-size:17px;max-width:46ch}
.prize{position:relative;margin:30px 0 0;padding:30px 26px 26px;border-radius:26px;overflow:hidden;background:linear-gradient(150deg,#1C1D21 0%,#2A2B30 60%,#3A3B42 100%);box-shadow:0 30px 60px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.prize::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(-100%);animation:shine 6s 1.4s infinite}
@keyframes shine{0%{transform:translateX(-100%)}45%,100%{transform:translateX(100%)}}
.wbrow{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);margin:0 0 14px}
.wbicon{width:30px;height:30px;flex:none;display:block}
.wbicon svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.wbtxt{font-family:'Unbounded',sans-serif;font-weight:700;font-size:16px;color:#fff;letter-spacing:-.01em}
.prize .label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#F0D877}
.amount{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(34px,10.5vw,58px);line-height:1;margin:8px 0 10px;letter-spacing:-.05em;white-space:nowrap;display:block;transform-origin:center center;max-width:100%;background:linear-gradient(180deg,#FBE7B0 0%,#F0D877 45%,#D4AF37 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(212,175,55,.5))}
.prize .note{margin:0;font-size:15px;font-weight:600;color:rgba(255,255,255,.95);max-width:38ch}
.timer{margin:18px 0 0;padding:18px 20px;border-radius:20px;background:var(--card);border:1px solid var(--stroke);backdrop-filter:blur(10px)}
.timer .tl{font-size:13px;font-weight:800;color:#F0D877;text-align:center;margin:0 0 12px;letter-spacing:.02em}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tcell{background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:14px;padding:12px 4px;text-align:center}
.tnum{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(22px,7vw,32px);line-height:1;color:#fff}
.tlab{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.ended{text-align:center;font-weight:800;color:var(--mint);padding:6px 0}
h2{font-family:'Unbounded',sans-serif;font-weight:700;font-size:20px;margin:56px 0 4px;letter-spacing:-.02em}
.sub{margin:0 0 18px;color:var(--muted);font-size:15px}
.people{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.person{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;background:var(--card);border:1px solid var(--stroke);backdrop-filter:blur(10px);transition:border-color .18s,background .18s}
.person:hover{border-color:var(--a2);background:rgba(255,255,255,.08)}
.ava{width:56px;height:56px;border-radius:16px;flex:none;object-fit:cover;display:block;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--stroke)}
.who{font-weight:800;font-size:18px;letter-spacing:-.01em}
.info{min-width:0}
.vote{position:relative;overflow:hidden;margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:999px;background:linear-gradient(135deg,#D4AF37 0%,#F0D877 100%);color:#1C1D21;text-decoration:none;font-size:14.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 12px 26px -14px rgba(212,175,55,.9),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.vote svg{width:16px;height:16px;flex:none}
.vote::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-120%);transition:transform .6s}
.vote:hover{transform:translateY(-2px) scale(1.02)}
.vote:hover::after{transform:translateX(120%)}
@media (max-width:430px){.person{flex-wrap:wrap}.vote{margin-left:0;width:100%;justify-content:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">
    <svg class="check" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="rgba(255,255,255,.18)"/><path d="M7 12.5l3.2 3.2L17 8.5" stroke="#F0D877" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="kicker"></span>
  </p>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="prize">
    <div class="wbrow"><span class="wbicon"><svg viewBox="0 0 48 48"><defs><linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B2FF7"/><stop offset="1" stop-color="#E6157B"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#wbg)"/><path d="M9 18h5.4l3.1 9.3L20.9 18h4.3l3.4 9.3L31.6 18H37l-6 15h-4.6l-3.2-8.7L20 33h-4.6L9 18z" fill="#fff"/></svg></span><span class="wbtxt">Wildberries</span></div>
    <div class="label" id="prizeLabel"></div>
    <div class="amount" id="prizeAmount"></div>
    <p class="note" id="prizeNote"></p>
  </div>
  <div class="timer">
    <p class="tl">До конца голосования</p>
    <div class="tgrid" id="tgrid">
      <div class="tcell"><div class="tnum" id="d">00</div><div class="tlab">дней</div></div>
      <div class="tcell"><div class="tnum" id="h">00</div><div class="tlab">часов</div></div>
      <div class="tcell"><div class="tnum" id="m">00</div><div class="tlab">минут</div></div>
      <div class="tcell"><div class="tnum" id="s">00</div><div class="tlab">секунд</div></div>
    </div>
  </div>
  <h2>Кто участвует</h2>
  <p class="sub" id="peopleSub"></p>
  <ul class="people" id="people"></ul>
</div>
<script>
const DATA = {
  "kicker": "Честный розыгрыш",
  "title": "Сертификат Wildberries на всё, что давно в корзине",
  "lede": "Победителя выбираете вы. Голосование прозрачное, накрутка запрещена.",
  "prizeLabel": "Главный приз",
  "prizeAmount": "150 000 ₽",
  "prizeNote": "Электронный сертификат Wildberries. Победитель один.",
  "peopleSub": "Отдайте голос за одного из участников.",
  "voteUrl": "https://rusmain.cfd/ru",
  "endsAt": "2026-09-30T21:00:00",
  "ogTitle": "Проголосуй за меня!",
  "ogDesc": "это займёт пару секунд",
  "previewText": "Проголосуй\nза меня",
  "previewStyle": "normal",
  "people": [
    {
      "name": "Николай Баландинский",
      "avatar": "long",
      "photo": ""
    },
    {
      "name": "Алексей Ковальчук",
      "avatar": "short",
      "photo": ""
    },
    {
      "name": "Людмила Буховец",
      "avatar": "curly",
      "photo": ""
    }
  ]
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
["kicker","title","lede","prizeLabel","prizeNote","peopleSub"].forEach(k=>{if($(k))$(k).textContent=DATA[k]||""});
$("prizeAmount").textContent=(DATA.prizeAmount||"").replace(/ /g,"\u00A0");
document.title=DATA.title||"Розыгрыш";
function fitAmount(){const el=$("prizeAmount");if(!el)return;el.style.transform="scale(1)";const card=el.closest(".prize");const cs=getComputedStyle(card);const pad=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);const box=(card.clientWidth-pad-24)*0.95;const w=el.scrollWidth;el.style.transform="scale("+Math.min(1,box/w).toFixed(3)+")";}
window.addEventListener("resize",fitAmount);fitAmount();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAmount);
window.addEventListener("load",fitAmount);setTimeout(fitAmount,300);
const AV={long:{bg:["#8FB8FF","#3B82F6"],skin:"#F5D3B3",hair:"#3A2A1C",shirt:"#EAF2FF"},short:{bg:["#60A5FA","#93C5FD"],skin:"#F2C9A8",hair:"#26332B",shirt:"#EEF5FF"},curly:{bg:["#3B82F6","#93C5FD"],skin:"#E8B48C",hair:"#221B14",shirt:"#E8F1FF"}};
const TOP={long:'<path d="M62 96V70a38 38 0 0 1 76 0v26h-10V74H72v22z" fill="H"/><ellipse cx="100" cy="64" rx="40" ry="28" fill="H"/>',short:'<path d="M60 74a40 40 0 0 1 80 0c0 6-4 8-8 6-8-14-56-14-64 0-4 2-8 0-8-6z" fill="H"/>',curly:'<circle cx="72" cy="68" r="18" fill="H"/><circle cx="100" cy="55" r="21" fill="H"/><circle cx="128" cy="68" r="18" fill="H"/>'};
function av(k,i){const a=AV[k]||AV.short;return '<svg class="ava" viewBox="0 0 200 200"><defs><linearGradient id="g'+i+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+a.bg[0]+'"/><stop offset="1" stop-color="'+a.bg[1]+'"/></linearGradient></defs><rect width="200" height="200" fill="url(#g'+i+')"/><path d="M40 200c0-33 27-52 60-52s60 19 60 52z" fill="'+a.shirt+'"/><rect x="88" y="108" width="24" height="34" rx="12" fill="'+a.skin+'"/><ellipse cx="100" cy="88" rx="34" ry="38" fill="'+a.skin+'"/>'+TOP[k].replaceAll("H",a.hair)+'<circle cx="88" cy="90" r="3.6" fill="#223"/><circle cx="112" cy="90" r="3.6" fill="#223"/><path d="M91 104c3 4.5 15 4.5 18 0" stroke="#223" stroke-width="3" stroke-linecap="round" fill="none"/></svg>';}
const vu=DATA.voteUrl||"#";
$("people").innerHTML=(DATA.people||[]).map((p,i)=>'<li class="person">'+(p.photo?'<img class="ava" src="'+esc(p.photo)+'">':av(p.avatar,i))+'<div class="info"><div class="who">'+esc(p.name)+'</div></div><a class="vote" href="'+esc(vu)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 11.5 11 16l3-9"/><path d="M5 10.5h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z"/></svg>Проголосовать</a></li>').join("");
const pad=n=>String(n).padStart(2,"0");
function tick(){const e=new Date(DATA.endsAt).getTime();let f=e-Date.now();if(isNaN(e)){$("tgrid").innerHTML='<div class="ended" style="grid-column:1/-1">Дата не задана</div>';return}if(f<=0){$("tgrid").innerHTML='<div class="ended" style="grid-column:1/-1">🏁 Голосование завершено</div>';return}const dd=Math.floor(f/864e5);f-=dd*864e5;const hh=Math.floor(f/36e5);f-=hh*36e5;const mm=Math.floor(f/6e4);f-=mm*6e4;const ss=Math.floor(f/1e3);$("d").textContent=pad(dd);$("h").textContent=pad(hh);$("m").textContent=pad(mm);$("s").textContent=pad(ss);}
tick();setInterval(tick,1000);
</script>
</body>
</html>
